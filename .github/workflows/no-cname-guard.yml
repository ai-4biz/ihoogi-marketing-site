name: Allow only approved CNAME (dual-URL)

# Policy: www.ihoogi.co.il is an ADDITION.
# github.io URL must remain available; do not treat custom domain as a replacement.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow only www.ihoogi.co.il CNAME
        run: |
          if [ ! -f CNAME ]; then
            echo "::error::CNAME missing — expected www.ihoogi.co.il (addition alongside github.io)"
            exit 1
          fi
          actual="$(tr -d '[:space:]' < CNAME)"
          expected="www.ihoogi.co.il"
          if [ "$actual" != "$expected" ]; then
            echo "::error::CNAME must be exactly '$expected' (got '$actual')"
            exit 1
          fi
          echo "OK: CNAME=$actual (github.io remains available as parallel URL)"
