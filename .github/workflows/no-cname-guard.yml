name: Block CNAME (protect github.io URL)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if CNAME file exists
        run: |
          if [ -f CNAME ]; then
            echo "::error::CNAME must not exist — it breaks https://ai-4biz.github.io/ihoogi-marketing-site/"
            exit 1
          fi
          echo "OK: no CNAME file"
